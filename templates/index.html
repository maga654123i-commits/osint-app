<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Intelligence Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
        }
        .user-bar {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        select, input, button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        button {
            background-color: #0284c7;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        button:hover {
            background-color: #0369a1;
        }
        .btn-buy {
            background-color: #22c55e;
        }
        .btn-buy:hover {
            background-color: #16a34a;
        }
        .result-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            display: none;
            border: 1px solid #334155;
        }
        pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            color: #4ade80;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>OSINT Tool</h1>

    <div class="user-bar">
        <span>Осталось попыток: <strong id="attemptCount">...</strong></span>
        <button class="btn-buy" onclick="buyAttempts()">Купить попытки</button>
    </div>
    
    <div class="search-box">
        <select id="searchType">
            <option value="domain">Домен (DNS / IP)</option>
            <option value="ip">IP-адрес (Geo / ISP)</option>
        </select>
        <input type="text" id="queryInput" placeholder="Введите домен или IP...">
        <button onclick="performSearch()">Искать</button>
    </div>

    <div id="results" class="result-box">
        <h3>Результаты поиска:</h3>
        <pre id="output">Загрузка...</pre>
    </div>
</div>

<script>
let userId = localStorage.getItem('osint_user_id');
if (!userId) {
    userId = 'user_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('osint_user_id', userId);
}

async function loadStatus() {
    try {
        const res = await fetch('/api/user_status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        document.getElementById('attemptCount').innerText = data.balance;
    } catch(e) {
        document.getElementById('attemptCount').innerText = 'Ошибка';
    }
}

async function performSearch() {
    const type = document.getElementById('searchType').value;
    const query = document.getElementById('queryInput').value.trim();
    const resultsBox = document.getElementById('results');
    const output = document.getElementById('output');

    if (!query) {
        alert("Введите значение для поиска");
        return;
    }

    resultsBox.style.display = 'block';
    output.innerText = 'Поиск...';

    try {
        const response = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, type, query })
        });

        const result = await response.json();
        if (response.ok && result.success) {
            output.innerText = JSON.stringify(result.data, null, 2);
            if (result.remaining_attempts !== undefined) {
                document.getElementById('attemptCount').innerText = result.remaining_attempts;
            }
        } else {
            output.innerText = 'Ошибка: ' + (result.error || 'Неизвестная ошибка');
        }
    } catch (e) {
        output.innerText = 'Ошибка соединения с сервером.';
    }
}

async function buyAttempts() {
    try {
        const res = await fetch('/api/buy_attempts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        if(data.success) {
            alert(data.message);
            document.getElementById('attemptCount').innerText = data.new_balance;
        }
    } catch(e) {
        alert('Ошибка при оформлении');
    }
}

loadStatus();
</script>

</body>
</html>
