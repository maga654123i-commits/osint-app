<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Intelligence Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .user-bar {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        label {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
        }
        select, input, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        button {
            background-color: #0284c7;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-buy {
            background-color: #22c55e;
            padding: 8px 15px;
            font-size: 14px;
        }
        .result-box {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            display: none;
            border: 1px solid #334155;
        }
        pre {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            color: #4ade80;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 OSINT Search Engine</h1>

    <div class="user-bar">
        <span>Баланс: <strong id="attemptCount">...</strong> попыток</span>
        <button class="btn-buy" onclick="buyAttempts()">Пополнить</button>
    </div>
    
    <div class="search-box">
        <label for="searchType">Категория поиска:</label>
        <select id="searchType">
            <option value="phone">📱 Контакты: Номер телефона / Email</option>
            <option value="person">🧔 Личность: ФИО / Дата рождения</option>
            <option value="auto">🚘 Транспорт: Госномер / VIN</option>
            <option value="social">💬 Соцсети: VK / Instagram / TikTok</option>
            <option value="telegram">✈️ Telegram: Username / ID</option>
            <option value="docs">📄 Документы: Паспорт / ИНН / СНИЛС / ВУ</option>
            <option value="property">🏠 Недвижимость: Адрес / Кадастровый №</option>
            <option value="company">🏢 Юр. лицо: ИНН / ОГРН</option>
            <option value="net">🌐 Онлайн-следы: IP / Домен</option>
        </select>

        <label for="queryInput">Запрос:</label>
        <input type="text" id="queryInput" placeholder="Введите данные...">
        <button onclick="performSearch()">Найти данные</button>
    </div>

    <div id="results" class="result-box">
        <h3>Результат поиска:</h3>
        <pre id="output">Загрузка...</pre>
    </div>
</div>

<script>
let userId = localStorage.getItem('osint_user_id');
if (!userId) {
    userId = 'user_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('osint_user_id', userId);
}

async function loadStatus() {
    try {
        const res = await fetch('/api/user_status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        document.getElementById('attemptCount').innerText = data.balance;
    } catch(e) {
        document.getElementById('attemptCount').innerText = 'Ошибка';
    }
}

async function performSearch() {
    const type = document.getElementById('searchType').value;
    const query = document.getElementById('queryInput').value.trim();
    const resultsBox = document.getElementById('results');
    const output = document.getElementById('output');

    if (!query) {
        alert("Введите значение для поиска");
        return;
    }

    resultsBox.style.display = 'block';
    output.innerText = 'Поиск по базам данных...';

    try {
        const response = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, type, query })
        });

        const result = await response.json();
        if (response.ok && result.success) {
            output.innerText = JSON.stringify(result.data, null, 4);
            if (result.remaining_attempts !== undefined) {
                document.getElementById('attemptCount').innerText = result.remaining_attempts;
            }
        } else {
            output.innerText = 'Ошибка: ' + (result.error || 'Неизвестная ошибка');
        }
    } catch (e) {
        output.innerText = 'Ошибка соединения с сервером.';
    }
}

async function buyAttempts() {
    try {
        const res = await fetch('/api/buy_attempts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        if(data.success) {
            alert(data.message);
            document.getElementById('attemptCount').innerText = data.new_balance;
        }
    } catch(e) {
        alert('Ошибка при оформлении');
    }
}

loadStatus();
</script>

</body>
</html>
